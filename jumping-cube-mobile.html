<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>PlayCanvas Jumping Cube - Mobile</title>
    <script src="https://code.playcanvas.com/playcanvas-stable.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #1a1a1a;
            font-family: Arial, sans-serif;
            overflow: hidden;
            touch-action: none;
        }
        
        #application-canvas {
            width: 100vw;
            height: 100vh;
            display: block;
            touch-action: none;
        }
        
        .controls {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            background: rgba(0, 0, 0, 0.8);
            padding: 10px;
            border-radius: 8px;
            font-size: 12px;
            z-index: 100;
            max-width: 200px;
        }
        
        .controls h3 {
            margin: 0 0 8px 0;
            color: #4CAF50;
            font-size: 14px;
        }
        
        .controls p {
            margin: 3px 0;
        }
        
        .touch-controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
            z-index: 100;
        }
        
        .jump-button {
            width: 80px;
            height: 80px;
            background: rgba(255, 100, 100, 0.8);
            border: 3px solid white;
            border-radius: 50%;
            color: white;
            font-weight: bold;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: manipulation;
            user-select: none;
        }
        
        .move-pad {
            width: 120px;
            height: 120px;
            background: rgba(100, 100, 255, 0.3);
            border: 3px solid rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            position: relative;
            touch-action: manipulation;
        }
        
        .move-stick {
            width: 40px;
            height: 40px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            transition: all 0.1s ease;
        }
        
        @media (max-width: 768px) {
            .controls {
                font-size: 10px;
                padding: 8px;
                max-width: 150px;
            }
        }
    </style>
</head>
<body>
    <div class="controls">
        <h3>iPad Controls</h3>
        <p><strong>Red Button</strong> - Jump</p>
        <p><strong>Blue Pad</strong> - Move</p>
        <p><strong>Touch Screen</strong> - Look around</p>
    </div>
    
    <div class="touch-controls">
        <div class="move-pad" id="movePad">
            <div class="move-stick" id="moveStick"></div>
        </div>
        <button class="jump-button" id="jumpButton">JUMP</button>
    </div>
    
    <canvas id="application-canvas"></canvas>
    
    <script>
        // Create PlayCanvas application
        const canvas = document.getElementById('application-canvas');
        const app = new pc.Application(canvas, {
            mouse: new pc.Mouse(canvas),
            keyboard: new pc.Keyboard(window),
            touch: new pc.TouchDevice(canvas)
        });
        
        // Set canvas size for mobile
        app.setCanvasFillMode(pc.FILLMODE_FILL_WINDOW);
        app.setCanvasResolution(pc.RESOLUTION_AUTO);
        
        // Enable physics
        app.systems.rigidbody.gravity.set(0, -15, 0);
        
        // Mobile touch controls
        let moveX = 0;
        let moveZ = 0;
        let jumpPressed = false;
        
        // Touch controls setup
        const movePad = document.getElementById('movePad');
        const moveStick = document.getElementById('moveStick');
        const jumpButton = document.getElementById('jumpButton');
        
        let isDragging = false;
        let padCenter = { x: 0, y: 0 };
        
        function updatePadCenter() {
            const rect = movePad.getBoundingClientRect();
            padCenter.x = rect.left + rect.width / 2;
            padCenter.y = rect.top + rect.height / 2;
        }
        
        updatePadCenter();
        window.addEventListener('resize', updatePadCenter);
        
        // Movement pad events
        movePad.addEventListener('touchstart', (e) => {
            e.preventDefault();
            isDragging = true;
            updatePadCenter();
        });
        
        movePad.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            e.preventDefault();
            
            const touch = e.touches[0];
            const deltaX = touch.clientX - padCenter.x;
            const deltaY = touch.clientY - padCenter.y;
            
            const distance = Math.sqrt(deltaX * deltaX + deltaY * deltaY);
            const maxDistance = 40;
            
            if (distance <= maxDistance) {
                moveStick.style.transform = `translate(${deltaX - 20}px, ${deltaY - 20}px)`;
                moveX = deltaX / maxDistance * 5;
                moveZ = deltaY / maxDistance * 5;
            } else {
                const angle = Math.atan2(deltaY, deltaX);
                const limitedX = Math.cos(angle) * maxDistance;
                const limitedY = Math.sin(angle) * maxDistance;
                moveStick.style.transform = `translate(${limitedX - 20}px, ${limitedY - 20}px)`;
                moveX = limitedX / maxDistance * 5;
                moveZ = limitedY / maxDistance * 5;
            }
        });
        
        movePad.addEventListener('touchend', (e) => {
            e.preventDefault();
            isDragging = false;
            moveStick.style.transform = 'translate(-50%, -50%)';
            moveX = 0;
            moveZ = 0;
        });
        
        // Jump button events
        jumpButton.addEventListener('touchstart', (e) => {
            e.preventDefault();
            jumpPressed = true;
            jumpButton.style.background = 'rgba(255, 50, 50, 1)';
        });
        
        jumpButton.addEventListener('touchend', (e) => {
            e.preventDefault();
            jumpPressed = false;
            jumpButton.style.background = 'rgba(255, 100, 100, 0.8)';
        });
        
        // Create camera
        const camera = new pc.Entity('camera');
        camera.addComponent('camera', {
            clearColor: new pc.Color(0.2, 0.3, 0.5),
            farClip: 1000
        });
        camera.setPosition(0, 8, 12);
        camera.lookAt(0, 0, 0);
        app.root.addChild(camera);
        
        // Simple camera touch look
        let lastTouchX = 0;
        let lastTouchY = 0;
        let cameraRotX = 0;
        let cameraRotY = 0;
        
        canvas.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) {
                lastTouchX = e.touches[0].clientX;
                lastTouchY = e.touches[0].clientY;
            }
        });
        
        canvas.addEventListener('touchmove', (e) => {
            if (e.touches.length === 1) {
                e.preventDefault();
                const deltaX = e.touches[0].clientX - lastTouchX;
                const deltaY = e.touches[0].clientY - lastTouchY;
                
                cameraRotY -= deltaX * 0.3;
                cameraRotX -= deltaY * 0.3;
                cameraRotX = Math.max(-30, Math.min(60, cameraRotX));
                
                lastTouchX = e.touches[0].clientX;
                lastTouchY = e.touches[0].clientY;
            }
        });
        
        // Create directional light
        const light = new pc.Entity('light');
        light.addComponent('light', {
            type: 'directional',
            color: new pc.Color(1, 1, 1),
            intensity: 1,
            castShadows: true,
            shadowBias: 0.05,
            shadowDistance: 50
        });
        light.setEulerAngles(45, 30, 0);
        app.root.addChild(light);
        
        // Create ground
        const ground = new pc.Entity('ground');
        ground.addComponent('render', {
            type: 'box',
            material: new pc.StandardMaterial()
        });
        ground.addComponent('rigidbody', {
            type: 'static',
            restitution: 0.3
        });
        ground.addComponent('collision', {
            type: 'box',
            halfExtents: new pc.Vec3(15, 0.5, 15)
        });
        ground.setLocalScale(30, 1, 30);
        ground.setPosition(0, -0.5, 0);
        
        // Set ground material
        ground.render.material.diffuse = new pc.Color(0.3, 0.7, 0.3);
        ground.render.material.update();
        
        app.root.addChild(ground);
        
        // Create jumping cube
        const cube = new pc.Entity('cube');
        cube.addComponent('render', {
            type: 'box',
            material: new pc.StandardMaterial(),
            receiveShadows: true,
            castShadows: true
        });
        cube.addComponent('rigidbody', {
            type: 'dynamic',
            mass: 1,
            restitution: 0.4,
            friction: 0.6
        });
        cube.addComponent('collision', {
            type: 'box',
            halfExtents: new pc.Vec3(0.5, 0.5, 0.5)
        });
        cube.setPosition(0, 2, 0);
        
        // Set cube material with animation
        cube.render.material.diffuse = new pc.Color(1, 0.3, 0.3);
        cube.render.material.metalness = 0.3;
        cube.render.material.shininess = 80;
        cube.render.material.update();
        
        app.root.addChild(cube);
        
        // Cube controller script
        const CubeController = pc.createScript('cubeController');
        
        CubeController.prototype.initialize = function() {
            this.jumpForce = 10;
            this.isGrounded = false;
            this.colorTime = 0;
            
            // Ground detection
            this.entity.collision.on('collisionstart', (result) => {
                if (result.other === ground) {
                    this.isGrounded = true;
                }
            });
            
            this.entity.collision.on('collisionend', (result) => {
                if (result.other === ground) {
                    this.isGrounded = false;
                }
            });
        };
        
        CubeController.prototype.update = function(dt) {
            const rigidbody = this.entity.rigidbody;
            const velocity = rigidbody.linearVelocity;
            
            // Apply horizontal movement from touch controls
            rigidbody.linearVelocity = new pc.Vec3(moveX, velocity.y, moveZ);
            
            // Jumping from touch button
            if (jumpPressed && this.isGrounded) {
                rigidbody.applyImpulse(new pc.Vec3(0, this.jumpForce, 0));
                this.isGrounded = false;
                jumpPressed = false; // Prevent continuous jumping
            }
            
            // Add visual feedback - rotate cube when moving
            if (moveX !== 0 || moveZ !== 0) {
                this.entity.rotate(moveZ * dt * 30, moveX * dt * 30, 0);
            }
            
            // Animated colors
            this.colorTime += dt;
            const r = 0.5 + 0.5 * Math.sin(this.colorTime * 2);
            const g = 0.3 + 0.3 * Math.sin(this.colorTime * 1.5);
            const b = 0.3 + 0.3 * Math.sin(this.colorTime * 3);
            this.entity.render.material.diffuse = new pc.Color(r, g, b);
            this.entity.render.material.update();
            
            // Camera follow with touch rotation
            const cubePos = this.entity.getPosition();
            const distance = 12;
            const height = 8;
            
            const radY = cameraRotY * Math.PI / 180;
            const radX = cameraRotX * Math.PI / 180;
            
            const cameraX = cubePos.x + distance * Math.sin(radY) * Math.cos(radX);
            const cameraY = cubePos.y + height + distance * Math.sin(radX);
            const cameraZ = cubePos.z + distance * Math.cos(radY) * Math.cos(radX);
            
            camera.setPosition(cameraX, cameraY, cameraZ);
            camera.lookAt(cubePos);
        };
        
        cube.addComponent('script');
        cube.script.create('cubeController');
        
        // Add ambient light
        app.scene.ambientLight = new pc.Color(0.3, 0.3, 0.4);
        
        // Enable shadows
        app.scene.shadowsEnabled = true;
        app.scene.shadowType = pc.SHADOW_PCF3;
        
        // Add some bouncing decorative cubes
        for (let i = 0; i < 8; i++) {
            const decorCube = new pc.Entity('decor-cube-' + i);
            decorCube.addComponent('render', {
                type: 'box',
                material: new pc.StandardMaterial(),
                receiveShadows: true,
                castShadows: true
            });
            decorCube.addComponent('rigidbody', {
                type: 'dynamic',
                mass: 0.3,
                restitution: 0.8
            });
            decorCube.addComponent('collision', {
                type: 'box',
                halfExtents: new pc.Vec3(0.25, 0.25, 0.25)
            });
            
            // Random positions in a circle
            const angle = (i / 8) * Math.PI * 2;
            const radius = 8 + Math.random() * 5;
            decorCube.setPosition(
                Math.cos(angle) * radius,
                Math.random() * 3 + 2,
                Math.sin(angle) * radius
            );
            
            // Bright colors
            decorCube.render.material.diffuse = new pc.Color(
                0.5 + Math.random() * 0.5,
                0.5 + Math.random() * 0.5,
                0.5 + Math.random() * 0.5
            );
            decorCube.render.material.metalness = 0.8;
            decorCube.render.material.update();
            
            app.root.addChild(decorCube);
        }
        
        // Start the application
        app.start();
        
        // Handle orientation changes
        window.addEventListener('orientationchange', function() {
            setTimeout(() => {
                app.resizeCanvas();
                updatePadCenter();
            }, 100);
        });
        
        // Handle resize
        window.addEventListener('resize', function() {
            app.resizeCanvas();
            updatePadCenter();
        });
        
        console.log('PlayCanvas Jumping Cube for iPad loaded successfully!');
        console.log('Use touch controls to play!');
    </script>
</body>
</html>
