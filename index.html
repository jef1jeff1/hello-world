<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlayCanvas Jumping Cube</title>
    <script src="https://code.playcanvas.com/playcanvas-stable.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #1a1a1a;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }
        
        #application-canvas {
            width: 100%;
            height: 100vh;
            display: block;
        }
        
        .controls {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 8px;
            font-size: 14px;
            z-index: 100;
        }
        
        .controls h3 {
            margin: 0 0 10px 0;
            color: #4CAF50;
        }
        
        .controls p {
            margin: 5px 0;
        }
    </style>
</head>
<body>
    <div class="controls">
        <h3>Controls</h3>
        <p><strong>SPACE</strong> - Jump</p>
        <p><strong>WASD</strong> - Move</p>
        <p><strong>Mouse</strong> - Look around</p>
    </div>
    
    <canvas id="application-canvas"></canvas>
    
    <script>
        // Create PlayCanvas application
        const canvas = document.getElementById('application-canvas');
        const app = new pc.Application(canvas, {
            mouse: new pc.Mouse(canvas),
            keyboard: new pc.Keyboard(window),
            touch: new pc.TouchDevice(canvas)
        });
        
        // Set canvas size
        app.setCanvasFillMode(pc.FILLMODE_FILL_WINDOW);
        app.setCanvasResolution(pc.RESOLUTION_AUTO);
        
        // Enable physics
        app.systems.rigidbody.gravity.set(0, -20, 0);
        
        // Create camera
        const camera = new pc.Entity('camera');
        camera.addComponent('camera', {
            clearColor: new pc.Color(0.2, 0.3, 0.5),
            farClip: 1000
        });
        camera.setPosition(0, 5, 10);
        camera.lookAt(0, 0, 0);
        app.root.addChild(camera);
        
        // Add camera controls
        const CameraController = pc.createScript('cameraController');
        
        CameraController.prototype.initialize = function() {
            this.eulers = new pc.Vec3();
            this.mouseSpeed = 0.2;
            
            // Mouse look
            if (this.app.mouse) {
                this.app.mouse.on('mousemove', this.onMouseMove, this);
                this.app.mouse.on('mousedown', () => {
                    this.app.mouse.enablePointerLock();
                });
            }
        };
        
        CameraController.prototype.onMouseMove = function(event) {
            if (pc.Mouse.isPointerLocked()) {
                this.eulers.x -= event.dy * this.mouseSpeed;
                this.eulers.y -= event.dx * this.mouseSpeed;
                
                this.eulers.x = pc.math.clamp(this.eulers.x, -90, 90);
                
                this.entity.setEulerAngles(this.eulers);
            }
        };
        
        camera.addComponent('script');
        camera.script.create('cameraController');
        
        // Create directional light
        const light = new pc.Entity('light');
        light.addComponent('light', {
            type: 'directional',
            color: new pc.Color(1, 1, 1),
            intensity: 1,
            castShadows: true,
            shadowBias: 0.05,
            shadowDistance: 50
        });
        light.setEulerAngles(45, 30, 0);
        app.root.addChild(light);
        
        // Create ground
        const ground = new pc.Entity('ground');
        ground.addComponent('render', {
            type: 'box',
            material: new pc.StandardMaterial()
        });
        ground.addComponent('rigidbody', {
            type: 'static',
            restitution: 0.3
        });
        ground.addComponent('collision', {
            type: 'box',
            halfExtents: new pc.Vec3(10, 0.5, 10)
        });
        ground.setLocalScale(20, 1, 20);
        ground.setPosition(0, -0.5, 0);
        
        // Set ground material
        ground.render.material.diffuse = new pc.Color(0.3, 0.7, 0.3);
        ground.render.material.update();
        
        app.root.addChild(ground);
        
        // Create jumping cube
        const cube = new pc.Entity('cube');
        cube.addComponent('render', {
            type: 'box',
            material: new pc.StandardMaterial(),
            receiveShadows: true,
            castShadows: true
        });
        cube.addComponent('rigidbody', {
            type: 'dynamic',
            mass: 1,
            restitution: 0.4,
            friction: 0.6
        });
        cube.addComponent('collision', {
            type: 'box',
            halfExtents: new pc.Vec3(0.5, 0.5, 0.5)
        });
        cube.setPosition(0, 2, 0);
        
        // Set cube material
        cube.render.material.diffuse = new pc.Color(1, 0.3, 0.3);
        cube.render.material.metalness = 0.3;
        cube.render.material.shininess = 80;
        cube.render.material.update();
        
        app.root.addChild(cube);
        
        // Cube controller script
        const CubeController = pc.createScript('cubeController');
        
        CubeController.prototype.initialize = function() {
            this.jumpForce = 8;
            this.moveSpeed = 5;
            this.isGrounded = false;
            
            // Ground detection
            this.entity.collision.on('collisionstart', (result) => {
                if (result.other === ground) {
                    this.isGrounded = true;
                }
            });
            
            this.entity.collision.on('collisionend', (result) => {
                if (result.other === ground) {
                    this.isGrounded = false;
                }
            });
        };
        
        CubeController.prototype.update = function(dt) {
            const rigidbody = this.entity.rigidbody;
            const velocity = rigidbody.linearVelocity;
            
            // Movement
            let moveX = 0;
            let moveZ = 0;
            
            if (this.app.keyboard.isPressed(pc.KEY_A)) moveX = -this.moveSpeed;
            if (this.app.keyboard.isPressed(pc.KEY_D)) moveX = this.moveSpeed;
            if (this.app.keyboard.isPressed(pc.KEY_W)) moveZ = -this.moveSpeed;
            if (this.app.keyboard.isPressed(pc.KEY_S)) moveZ = this.moveSpeed;
            
            // Apply horizontal movement
            rigidbody.linearVelocity = new pc.Vec3(moveX, velocity.y, moveZ);
            
            // Jumping
            if (this.app.keyboard.wasPressed(pc.KEY_SPACE) && this.isGrounded) {
                rigidbody.applyImpulse(new pc.Vec3(0, this.jumpForce, 0));
                this.isGrounded = false;
            }
            
            // Add some visual feedback - rotate cube when moving
            if (moveX !== 0 || moveZ !== 0) {
                this.entity.rotate(moveZ * dt * 50, moveX * dt * 50, 0);
            }
            
            // Camera follow
            const cameraTarget = this.entity.getPosition().clone();
            cameraTarget.add(new pc.Vec3(0, 5, 10));
            camera.setPosition(camera.getPosition().lerp(cameraTarget, dt * 2));
        };
        
        cube.addComponent('script');
        cube.script.create('cubeController');
        
        // Add some ambient light
        app.scene.ambientLight = new pc.Color(0.2, 0.2, 0.3);
        
        // Enable shadows
        app.scene.shadowsEnabled = true;
        app.scene.shadowType = pc.SHADOW_PCF3;
        
        // Start the application
        app.start();
        
        // Handle window resize
        window.addEventListener('resize', function() {
            app.resizeCanvas(canvas.width, canvas.height);
        });
        
        // Add some decorative cubes
        for (let i = 0; i < 5; i++) {
            const decorCube = new pc.Entity('decor-cube-' + i);
            decorCube.addComponent('render', {
                type: 'box',
                material: new pc.StandardMaterial(),
                receiveShadows: true,
                castShadows: true
            });
            decorCube.addComponent('rigidbody', {
                type: 'dynamic',
                mass: 0.5,
                restitution: 0.6
            });
            decorCube.addComponent('collision', {
                type: 'box',
                halfExtents: new pc.Vec3(0.3, 0.3, 0.3)
            });
            
            // Random positions
            decorCube.setPosition(
                (Math.random() - 0.5) * 15,
                Math.random() * 5 + 2,
                (Math.random() - 0.5) * 15
            );
            
            // Random colors
            decorCube.render.material.diffuse = new pc.Color(
                Math.random(),
                Math.random(),
                Math.random()
            );
            decorCube.render.material.update();
            
            app.root.addChild(decorCube);
        }
        
        console.log('PlayCanvas Jumping Cube loaded successfully!');
        console.log('Use WASD to move, SPACE to jump, and mouse to look around');
    </script>
</body>
</html>
